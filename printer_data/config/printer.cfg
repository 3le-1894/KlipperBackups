[include configurations/mainsail.cfg]

[include configurations/Fans/*.cfg]

[include configurations/Filaments/*.cfg]

[include configurations/Heaters/*.cfg]

[include configurations/MCU/*.cfg]

[include configurations/Motors/*.cfg]

[include configurations/Probe/*.cfg]

[include configurations/TMC2130/*.cfg]

[include configurations/PlugIns/*.cfg]

[include configurations/00_Modules/*.cfg]

[probe]
#z_offset: 0.900

[safe_z_home]
home_xy_position:		11, 6
speed: 					200
move_to_previous: 		False

[extruder]
#control:				mpc

[heater_bed]
#control:            	pid_v
#pid_Kp:             	30.572
#pid_Ki:             	0.332
#pid_Kd:             	703.910

[idle_timeout]
timeout:	43200
gcode:		M84

[delayed_gcode STATUS_CHECK]
gcode:
    STATUS
initial_duration: 1.0
#description: Update the duration of a delayed_gcode
#   This will add a short description used at the HELP command or while
#   using the auto completion feature. Default "Update the duration of 
#   a delayed_gcode"

