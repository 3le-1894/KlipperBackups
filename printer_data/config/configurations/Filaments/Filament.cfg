[gcode_macro _FILAMENT_START]
description: Import filament specific settings...
gcode:
    {% set OFFSET = params.OFFSET|float %}
    {% set PA = params.PA|float %}
    {% set FLOW = params.FLOW|default(100)|float %}
    {% set RETRACT_AMOUNT = params.RETRACT_AMOUNT|default(0.4)|float %}
    {% set RETRACT_SPEED = params.RETRACT_SPEED|default(35)|float %}
    
    SET_GCODE_OFFSET Z={OFFSET}
    SET_PRESSURE_ADVANCE ADVANCE={PA}
    M221 S{FLOW}
    SET_RETRACTION RETRACT_LENGTH={RETRACT_AMOUNT} RETRACT_SPEED={RETRACT_SPEED} Z_HOP_HEIGHT=0.2
    _SET_MPC_MATERIAL MATERIAL={params.MATERIAL}

[gcode_macro _FILAMENT_END]
gcode:
    SET_GCODE_OFFSET Z=0.0
    SET_PRESSURE_ADVANCE ADVANCE=0.0
    M221 S100
    RESET_RETRACTION